apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: ecocampus
  labels:
    app: ecocampus-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecocampus-frontend
  template:
    metadata:
      labels:
        app: ecocampus-frontend
    spec:
      containers:
        - name: frontend
          image: ecocampus/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ecocampus
spec:
  selector:
    app: ecocampus-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort
