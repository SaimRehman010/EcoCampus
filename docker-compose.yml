services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecocampus-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/ecocampus
      - JWT_SECRET=ecocampus_production_jwt_secret_key_2026
      - JWT_EXPIRE=7d
      - PYTHON_SERVICE_URL=http://python-service:5001
    depends_on:
      - mongo

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: ecocampus-python-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - FLASK_ENV=production
      - DEFAULT_RATE_PER_KWH=0.15

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ecocampus-ai-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - FLASK_ENV=production
      - EXPRESS_BACKEND_URL=http://backend:5000
      - PYTHON_SERVICE_URL=http://python-service:5001
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      - backend
      - python-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecocampus-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_EXPRESS_URL=http://localhost:5000/api
      - VITE_PYTHON_URL=http://localhost:5001/api
      - VITE_AI_URL=http://localhost:5002/api/ai
    depends_on:
      - backend

  mongo:
    image: mongo:latest
    container_name: ecocampus-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
